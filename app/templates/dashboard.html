{% extends "base.html" %}

{% block title %}Dashboard — FASTag Portal{% endblock %}
{% block meta_description %}Welcome to your FASTag dashboard.{% endblock %}

{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; text-align: center; padding: 40px;">
  <h1 style="font-size: 32px; color: #0A1628; margin-bottom: 16px;">
    Welcome to the FASTag dashboard, {{ user.full_name }}! 👋
  </h1>
  <p style="color: #7B8494; font-size: 16px; margin-bottom: 32px;">
    You have successfully logged in.
  </p>
  
  <a href="{{ url_for('main.logout') }}" style="
    display: inline-block;
    padding: 10px 24px;
    background-color: #fff;
    color: #D93025;
    border: 1.5px solid #EEF0F4;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s;
  " onmouseover="this.style.borderColor='#D93025'; this.style.backgroundColor='rgba(217, 48, 37, 0.05)';" onmouseout="this.style.borderColor='#EEF0F4'; this.style.backgroundColor='#fff';">
    Sign Out
  </a>
</div>
{% endblock %}
